mode: gnnddpm
model_type: gnnddpm
device: auto  # uses CUDA when available, otherwise CPU
seed: 42

data_dir: data/credit_score

# Shared backbone architecture used by both GNN-VAE and GNN-DDPM.
gnn:
  hidden_dim: 64
  out_dim: 64
  num_layers: 2
  dropout: 0.1
  categorical_embedding_dim: 8

graph:
  output_dir: artifacts/credit_score/gnnddpm/graphs

training:
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.00001
  gradient_clip: 1.0
  patience: 10
  num_threads: 2
  output_dir: artifacts/credit_score/gnnddpm/training

ddpm:
  num_steps: 1000
  beta_start: 0.0001
  beta_end: 0.02
  hidden_dim: 64
  time_dim: 32

generation:
  checkpoint: latest  # or an explicit path to a training run's best.pt
  seed: 42
  root_rows: 10       # rows per root table; descendant counts follow training statistics
  max_rows_per_table: 100000
  temperature: 1.0    # VAE category/boolean sampling
  ddpm_sweeps: 2     # conditional passes over synthetic tables
  clip_to_training_range: true  # clipping counts are recorded in the report
  restore_fake_pii: true
  output_dir: artifacts/credit_score/gnnddpm/synthetic

data_splitting:
  validation_fraction: 0.2
  seed: 42
  output_dir: artifacts/credit_score/gnnddpm/splits

dtype_detection:
  output_path: artifacts/credit_score/detected_schema.yaml

# Standalone stages save separate copies; preprocessing_pipeline combines them.
preprocessing:
  output_dir: artifacts/credit_score/preprocessed
  pipeline_output_dir: artifacts/credit_score/gnnddpm/prepared
  # input_dir: artifacts/credit_score/fake_pii_data
  numerical:
    errors: raise
    fill_missing: median  # pipeline learns this only from training rows
    scaling: standard     # pipeline: standard or none
  categorical:
    lowercase: false
    fill_missing: null   # use a string such as __MISSING__ to fill blanks
  boolean:
    errors: raise
    fill_missing: null   # pipeline learns training mode; or set 0/1
  datetime:
    format: mixed        # or an explicit format such as '%Y-%m-%d'
    dayfirst: false
    utc: true
    scaling: standard     # pipeline scales Unix seconds using training statistics
    errors: raise

# PII candidates are replaced on copies; source files are unchanged.
pii:
  output_path: artifacts/credit_score/pii_report.yaml
  output_dir: artifacts/credit_score/fake_pii_data
pii_locale: en_IN
pii_seed: 42
pii_columns:
  customers:
    customer_name: name
    contact_no: phone
    address: address
    pincode: postal_code
    city: city
    state: state
  accounts:
    account_number: bank_account_number
    ifsc_code: ifsc_code
  repayments:
    payment_reference: payment_reference

# Explicit key rules used by data_validation; add only verified keys.
primary_keys:
  customers: [customer_id]
  accounts: [account_id]
  loans: [loan_id]
  repayments: [repayment_id]
  transactions: [transaction_id]
  credit_inquiries: [inquiry_id]
relationships:
  - parent_table_name: customers
    parent_primary_key: customer_id
    child_table_name: accounts
    child_foreign_key: customer_id
  - parent_table_name: customers
    parent_primary_key: customer_id
    child_table_name: loans
    child_foreign_key: customer_id
  - parent_table_name: customers
    parent_primary_key: customer_id
    child_table_name: credit_inquiries
    child_foreign_key: customer_id
  - parent_table_name: accounts
    parent_primary_key: account_id
    child_table_name: transactions
    child_foreign_key: account_id
  - parent_table_name: loans
    parent_primary_key: loan_id
    child_table_name: repayments
    child_foreign_key: loan_id
