#   prediction_target: epsilon      # epsilon | x0
#   loss_type: mse                  # mse | huber
#   categorical_diffusion: multinomial   # multinomial | gaussian_onehot
#   sampling_method: ddim           # ddpm | ddim
#   sampling_steps: 100             # fewer steps than timesteps = faster sampling (ddim)
