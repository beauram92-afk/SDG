# # The GNN encoder gives every row a context vector (its own features + its parents/children);
# # the diffusion model then learns to denoise row features conditioned on that vector.
# # epochs: use 1 for a smoke test, 300-1000 for a real run (diffusion needs more epochs than a VAE).
# gnn_epochs: 300
# ddpm_epochs: 500
# epochs: 500
# hidden_dim: 64
# gnn_out_dim: 32          # size of the graph context vector fed to the denoiser
# dropout: 0.1

